    <script>
      // theme before first paint: the same setting as the editor's
      try {
        const s = JSON.parse(localStorage.getItem('pune-remix:settings') || '{}');
        const d = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
