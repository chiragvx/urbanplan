<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pune Remix — map editor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d2126'/%3E%3Cpath d='M9 26L14 6M23 26L18 6' stroke='%23ff8a3d' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M16 8v3M16 15v3M16 22v3' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="loading">
      <div class="load-card">
        <div class="logo big">Pune<span>Remix</span></div>
        <div class="load-sub">Edit the city in 2D, see it in 3D — Koregaon Park · Kalyani Nagar</div>
        <div class="bar"><div id="load-bar"></div></div>
        <div id="load-msg">Starting engine…</div>
      </div>
    </div>

    <div id="shell">
      <div id="topbar"></div>
      <div id="main">
        <div id="left"></div>
        <div id="stage">
          <canvas id="gl"></canvas>
          <canvas id="overlay"></canvas>
          <div id="stage-ui"></div>
        </div>
        <div id="right"></div>
      </div>
      <div id="status"></div>
    </div>
    <div id="modals"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
