<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UrbanPlan — map editor</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // theme before first paint (the app keeps it in step afterwards)
      try {
        const s = JSON.parse(localStorage.getItem('pune-remix:settings') || '{}');
        const d = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        document.documentElement.dataset.panels = s.panels || 'floating';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="loading">
      <div class="load-card">
        <div class="logo big">Urban<span>Plan</span></div>
        <div class="load-sub" id="load-sub">Edit the city in 2D, see it in 3D</div>
        <div class="bar"><div id="load-bar"></div></div>
        <div id="load-msg">Starting engine…</div>
      </div>
    </div>

    <div id="shell">
      <div id="stage">
        <canvas id="gl"></canvas>
        <canvas id="overlay"></canvas>
        <div id="stage-ui"></div>
        <div id="left"></div>
        <div id="right"></div>
        <div id="dock"></div>
        <div id="studio"></div>
      </div>
    </div>
    <div id="home"></div>
    <div id="modals"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
