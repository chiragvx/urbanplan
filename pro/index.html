<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UrbanPlan Pro</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      // Pro opens from the dashboard: a bare /pro/ goes there first, before anything loads. A project to open
      // (?p=, ?new=, ?local, a share link's #s=) comes straight in, and so does a reload of Pro itself.
      try {
        const nav = performance.getEntriesByType('navigation')[0];
        if (!location.search && !location.hash && !(nav && nav.type === 'reload')) location.replace(new URL('../dashboard/', location.href).href);
      } catch (e) { /* stay in Pro */ }
    </script>
    <script>
      // theme before first paint: the same setting as the site and the editor
      try {
        const s = JSON.parse(localStorage.getItem('pune-remix:settings') || '{}');
        const d = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="pro"></div>
    <script type="module" src="/src/pro/main.tsx"></script>
  </body>
</html>
